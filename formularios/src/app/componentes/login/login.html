<div class="form-container">
    <h2>Inicio de Sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- Campo Email -->
        <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" formControlName="email" class="form-control" />
            <div *ngIf="f['email'].touched && f['email'].invalid" class="error-text">
                <small *ngIf="f['email'].errors?.['required']">El correo es obligatorio.</small>
                <small *ngIf="f['email'].errors?.['email']">Ingrese un formato de correo válido.</small>
            </div>
        </div>

        <!-- Campo Contraseña -->
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" formControlName="password" class="form-control" />
            <div *ngIf="f['password'].touched && f['password'].invalid" class="error-text">
                <small *ngIf="f['password'].errors?.['required']">La contraseña es obligatoria.</small>
                <small *ngIf="f['password'].errors?.['minlength']">Debe tener al menos 6 caracteres.</small>
            </div>
        </div>

        <!-- Botón de Envío -->
        <button type="submit" [disabled]="loginForm.invalid" class="btn-submit">
            Iniciar Sesión
        </button>
    </form>
    <div *ngIf="mensajeExito" class="success-alert">
        {{ mensajeExito }}
    </div>
    <div *ngIf="mensajeError" class="success-alert">
        {{ mensajeError }}
    </div>
</div>
